name: office-automation
version: 1
description: Original Python Office workflow for grounded Excel analysis, weekly reports, and PPT decks using verified facts, a constrained DSL, python-docx, and python-pptx. Use when the user explicitly asks for the original Python Office skill.
entrypoints:
  - scripts/inspect_workbook.py
  - scripts/extract_facts.py
  - scripts/validate.py
  - scripts/render_docx.py
  - scripts/render_pptx.py
inputs:
  - xlsx
  - meeting-notes
  - constraints
outputs:
  - workbook-schema
  - verified-facts
  - docx
  - pptx
  - quality-report
tools:
  required:
    - read_file
    - write_file
    - exec
    - plan
providers: {}
permissions:
  required:
    - filesystem:read
    - filesystem:write-artifacts
    - process:execute
evals:
  - office-weekly-deterministic
