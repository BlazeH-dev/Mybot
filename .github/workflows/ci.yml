name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libolm-dev build-essential

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Lint with ruff
        run: uv run ruff check nanobot/

      - name: Run tests
        # P0 starts with a deterministic smoke gate. The full upstream suite
        # currently includes network, API-key, local-port, and home-directory
        # dependent tests; broaden this command as runtime phases harden.
        run: >
          uv run pytest
          tests/fixtures/office_weekly/test_fixture.py
          tests/config/test_model_presets.py
          tests/command/test_model_command.py
          tests/webui/test_settings_api.py
          -q
