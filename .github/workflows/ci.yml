name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: >
          sudo apt-get update &&
          sudo apt-get install -y libolm-dev build-essential bubblewrap

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Lint with ruff
        run: python -m ruff check nanobot/ tests/runtime/

      - name: Run tests
        # P0 starts with a deterministic smoke gate. The full upstream suite
        # currently includes network, API-key, local-port, and home-directory
        # dependent tests; broaden this command as runtime phases harden.
        run: >
          python -m pytest
          tests/runtime/
          tests/skills/test_office_python.py
          tests/skills/test_officecli_runtime.py
          tests/agent/tools/test_plan_tool.py
          tests/config/test_model_presets.py
          tests/command/test_model_command.py
          tests/webui/test_settings_api.py
          -q

      - name: Generate deterministic Runtime reports
        run: |
          python -m nanobot.runtime.evals.report \
            tests/fixtures/runtime_eval/*.json \
            --json /tmp/runtime-eval.json \
            --markdown /tmp/runtime-eval.md
          python -m nanobot.runtime.evals.subagent_compare \
            --json /tmp/subagent-comparison.json \
            --markdown /tmp/subagent-comparison.md
          cmp /tmp/runtime-eval.json benchmarks/latest.json
          cmp /tmp/runtime-eval.md benchmarks/latest.md
          cmp /tmp/subagent-comparison.json benchmarks/subagent-comparison.json
          cmp /tmp/subagent-comparison.md benchmarks/subagent-comparison.md
